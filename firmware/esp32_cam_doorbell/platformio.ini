; ============================================================================
; PlatformIO Configuration for GOOUUU ESP32-S3-CAM Smart Video Doorbell
; ============================================================================
; Microcontroller: ESP32-S3 (Dual-Core Xtensa LX7 @ 240MHz)
; Memory: 16MB Flash, 8MB Octal (OPI) PSRAM (N16R8)
; Peripherals: OV3660 Camera, RC522 SPI, PCF8574 I2C, INMP441, MAX98357A
; ============================================================================

[platformio]
default_envs = esp32s3_doorbell
src_dir = src
include_dir = include

[env:esp32s3_doorbell]
platform = espressif32 @ 6.13.0
board = esp32-s3-devkitc-1
framework = arduino

; Serial Monitor & Upload Speeds
monitor_speed = 115200
upload_speed = 460800
monitor_filters = esp32_exception_decoder, time, default

; Board Hardware Configuration: 16MB Flash & Octal OPI PSRAM
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.flash_size = 16MB

; Custom Partition Scheme (Large App + LittleFS for offline storage)
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

; Build Flags: PSRAM activation, debug level, cryptographic support
build_flags = 
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3
    -I include

; External Library Dependencies
lib_deps = 
    links2004/WebSockets @ 2.7.3
    miguelbalboa/MFRC522 @ 1.4.12
    adafruit/Adafruit NeoPixel @ 1.15.5
    bblanchon/ArduinoJson @ 7.4.3
